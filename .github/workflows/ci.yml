name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: minimart
          POSTGRES_USER: minimart
          POSTGRES_PASSWORD: minimart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minimart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and package the app
        run: mvn -q -f app/pom.xml clean package -DskipTests

      - name: Start the app
        run: |
          nohup java -jar app/target/minimart-app-boot.jar > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/products > /dev/null && exit 0
            sleep 2
          done
          echo "App failed to start"; cat app.log; exit 1

      - name: API tests (RestAssured)
        run: mvn -q -f tests/api/pom.xml test

      - name: Integration tests (Testcontainers)
        run: mvn -q -f tests/integration/pom.xml test

      - name: Install Playwright (UI)
        run: |
          cd tests/ui-playwright
          npm install
          npx playwright install --with-deps chromium firefox

      - name: UI tests (Playwright)
        run: cd tests/ui-playwright && npx playwright test

      - name: Install Cypress deps
        run: cd tests/ui-cypress && npm install

      - name: UI tests (Cypress)
        run: cd tests/ui-cypress && npx cypress run

      - name: Install E2E deps
        run: |
          cd tests/e2e
          npm install
          npx playwright install --with-deps chromium

      - name: E2E golden-path tests
        run: cd tests/e2e && npx playwright test

      - name: Install JMeter
        run: |
          wget -q https://dlcdn.apache.org//jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "$PWD/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"

      - name: Performance smoke run (scaled-down load test)
        run: |
          mkdir -p tests/performance/results
          cd tests/performance
          jmeter -n -t load-test.jmx -Jthreads=5 -Jrampup=2 -Jduration=15 -l results/load-test-results.jtl

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/ui-playwright/playwright-report/
          retention-days: 7

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: tests/performance/results/
          retention-days: 7

services:
  postgres:
    image: postgres:16-alpine
    container_name: minimart-postgres
    environment:
      POSTGRES_DB: minimart
      POSTGRES_USER: minimart
      POSTGRES_PASSWORD: minimart
    ports:
      - "5432:5432"
    volumes:
      - minimart-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minimart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minimart-pgdata:

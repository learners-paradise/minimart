<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${product.name} + ' - MiniMart'">Product - MiniMart</title>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>

<div th:replace="~{fragments :: header}"></div>

<main>
    <a href="/products">&larr; Back to products</a>

    <h1 th:text="${product.name}" data-testid="product-name"></h1>
    <span class="category" th:text="${product.category}"></span>
    <p th:text="${product.description}"></p>
    <p class="price" th:text="'$' + ${product.price}" data-testid="product-price"></p>
    <p data-testid="product-stock" th:text="${product.stockQuantity} + ' in stock'"></p>

    <form method="post" action="/cart/add" data-testid="add-to-cart-form">
        <input type="hidden" name="productId" th:value="${product.id}"/>
        <label>
            Quantity
            <input type="number" name="quantity" value="1" min="1"
                   data-testid="quantity-input" style="width:70px"/>
        </label>
        <button type="submit" data-testid="add-to-cart-button" th:disabled="${product.stockQuantity == 0}">
            Add to cart
        </button>
    </form>
</main>

</body>
</html>

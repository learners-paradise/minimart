spring:
  application:
    name: minimart

  datasource:
    url: jdbc:postgresql://localhost:5432/minimart
    username: minimart
    password: minimart
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false

server:
  port: 8080

logging:
  level:
    com.minimart: INFO
